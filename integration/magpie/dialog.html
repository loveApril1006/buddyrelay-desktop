<dialog id="buddyrelayDialog" aria-labelledby="buddyrelayTitle">
  <h2 id="buddyrelayTitle">WorkBuddy</h2>
  <p></p>
  <div class="buddyrelay-buttons">
    <button type="button" data-buddyrelay-action="open" data-zh="打开 WorkBuddy 管理" data-en="Open WorkBuddy"></button>
    <button type="button" data-buddyrelay-action="connect/domestic" data-zh="接入国内反代" data-en="Connect domestic relay"></button>
    <button type="button" data-buddyrelay-action="connect/international" data-zh="接入国际反代" data-en="Connect international relay"></button>
    <button type="button" data-buddyrelay-action="update" data-zh="检查 BuddyRelay 更新" data-en="Check BuddyRelay updates"></button>
    <form method="dialog"><button data-zh="关闭" data-en="Close"></button></form>
  </div>
  <div id="buddyrelayStatus" role="status"></div>
</dialog>
