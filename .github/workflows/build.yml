name: Build and release BuddyRelay

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache: false

      - name: Validate release version
        run: node scripts/version.mjs check

      - name: Install frontend dependencies
        run: npm ci

      - name: Build bundled Magpie from source
        shell: pwsh
        run: ./scripts/build-magpie.ps1

      - name: Build NSIS installer
        run: npm run tauri -- build --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.bundled.json -- --locked

      - name: Stage installer and checksum
        shell: pwsh
        run: |
          $app = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $name = "$($app.productName)_$($app.version)_x64-setup.exe"
          $path = Join-Path 'target/x86_64-pc-windows-msvc/release/bundle/nsis' $name
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $path).Hash.ToLowerInvariant()
          New-Item -ItemType Directory -Path release
          Copy-Item -LiteralPath $path -Destination release
          "$sha  $name" | Set-Content -Encoding ascii release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: buddyrelay-windows-x64
          path: release/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: buddyrelay-windows-x64
          path: release

      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "BuddyRelay $GITHUB_REF_NAME" \
            --notes "Windows x64 installer. Includes WorkBuddy-Switch2api v1.6.30 and Magpie v0.1.4456 under MIT."
